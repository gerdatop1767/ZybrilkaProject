name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zybrilka
          POSTGRES_PASSWORD: zybrilka
          POSTGRES_DB: zybrilka_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zybrilka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Apply migrations to PostgreSQL 16 (twice, must be idempotent)
        env:
          DATABASE_URL: postgres://zybrilka:zybrilka@localhost:5432/zybrilka_ci
        run: |
          pnpm --filter @zybrilka/db db:migrate:prod
          pnpm --filter @zybrilka/db db:migrate:prod
